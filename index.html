<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Звички Дар'ї</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Звички">
<meta name="theme-color" content="#FFF4F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: одна колонка до 520px, вкладки внизу; «солодка вата» — завжди світла пастель */
:root{
  color-scheme:light;
  --bg:#FFF4F9; --bg2:#F6EEFF; --surface:#FFFFFF; --sunk:#FCE8F2; --line:#F6D7E7;
  --fg:#4A2340; --muted:#9A7290; --pink:#FF8FC1; --pink-deep:#D9478A; --lav:#C3AEF2; --lav-deep:#8A6CD6;
  --mint:#8EDDC3; --peach:#FFC8A8; --sky:#A9D8FF; --lemon:#FFE48A;
  --m1:#C9CFEA; --m2:#D8C8F2; --m3:#FDE3A7; --m4:#FFC4DD; --m5:#FF97C6;
  --f-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  --r:22px; --shadow:0 6px 20px rgb(217 71 138 / .10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;text-wrap:balance}
h2{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hello{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:4px 2px}
.hello h1{font-size:26px;line-height:1.15}
.hello .sub{color:var(--muted);font-weight:600}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:16px;padding:8px 0;display:grid;justify-items:center;gap:2px;background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.day small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day i{font-style:normal;font-size:14px;line-height:1;min-height:14px}
.day[aria-pressed="true"]{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
.day[aria-pressed="true"] small{color:#fff}
.habits{display:grid;gap:10px}
.habit{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.habit .fill{position:absolute;inset:0 auto 0 0;background:var(--hc);opacity:.18;transition:width .35s ease;pointer-events:none}
.habit>*:not(.fill){position:relative}
.emo{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--hc) 30%,white)}
.habit .t{min-width:0}
.habit .t b{display:block;font-size:16px;overflow-wrap:anywhere}
.habit .t small{color:var(--muted);font-weight:600}
.chk{width:48px;height:48px;border-radius:50%;border:3px solid color-mix(in srgb,var(--hc) 70%,white);display:grid;place-items:center;font-size:22px;color:#fff;transition:transform .15s}
.chk.on{background:var(--hc);border-color:var(--hc)}
.chk:active{transform:scale(.9)}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--hc) 30%,white);font-size:20px;font-weight:800}
.cnt span{min-width:44px;text-align:center;font-weight:800}
.habit.done .t b{color:var(--pink-deep)}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{font-size:34px;border-radius:18px;padding:8px 0;background:var(--sunk);transition:transform .15s;display:grid;justify-items:center;gap:2px}
.mood small{font-size:11px;font-weight:700;color:var(--muted)}
.mood[aria-pressed="true"]{background:var(--mc);transform:translateY(-3px) scale(1.04)}
.mood[aria-pressed="true"] small{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:7px 12px;background:var(--sunk);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--lav);color:#fff}
.chip.add{background:none;border:2px dashed var(--line);color:var(--muted)}
textarea,input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
label.f{display:grid;gap:5px;font-weight:700;font-size:14px;min-width:0}
.btn{border-radius:18px;padding:13px 18px;font-weight:800;background:linear-gradient(135deg,var(--pink),var(--lav-deep));color:#fff;box-shadow:0 6px 16px rgb(217 71 138 / .25)}
.btn.soft{background:var(--sunk);color:var(--fg);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:14px}
.btn:disabled{opacity:.5}
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding:8px 0}
.big-emo{font-size:44px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgb(255 255 255 / .92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{padding:6px 2px;border-radius:16px;font-size:12px;font-weight:800;color:var(--muted);display:grid;justify-items:center;gap:1px}
nav.tabs button span{font-size:22px;line-height:1.1}
nav.tabs button[aria-current="page"]{background:var(--sunk);color:var(--pink-deep)}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--sunk);font-size:20px;font-weight:800;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:11px;font-weight:800;color:var(--muted);text-align:center;text-transform:uppercase}
.cell{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;position:relative}
.cell .e{position:absolute;bottom:2px;font-size:10px;line-height:1}
.cell.today{outline:2px solid var(--pink-deep);outline-offset:-2px}
.cell.future{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.hstat{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:2px dotted var(--line)}
.hstat:first-child{border-top:0}
.hstat .emo{width:44px;height:44px;font-size:24px;border-radius:14px}
.nums{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.nums b{color:var(--fg)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:6px}
.strip i{height:10px;border-radius:3px;background:var(--sunk)}
.cmp{display:grid;gap:8px}
.cmp .bar{display:grid;grid-template-columns:minmax(0,110px) 1fr 36px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.cmp .track{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.cmp .track i{display:block;height:100%;border-radius:99px}
.note{background:var(--sunk);border-radius:16px;padding:10px 12px;font-size:13px;color:var(--muted);font-weight:600}
.list-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dotted var(--line)}
.list-item:first-child{border-top:0}
.list-item .emo{width:44px;height:44px;font-size:24px;border-radius:14px}
.lnk{font-weight:800;color:var(--pink-deep);font-size:13px;padding:4px}
.lnk.danger{color:#C2334F}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(74 35 64 / .35);display:grid;align-items:end}
.panel{background:var(--surface);border-radius:28px 28px 0 0;max-width:520px;width:100%;margin:0 auto;max-height:90%;overflow:auto;display:grid;gap:14px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emojis button{font-size:24px;border-radius:12px;padding:4px 0}
.emojis button[aria-pressed="true"]{background:var(--sunk);outline:2px solid var(--pink)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;background:var(--c)}
.colors button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:16px;padding:4px;gap:4px}
.seg button{border-radius:12px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdays button{border-radius:12px;padding:8px 0;background:var(--sunk);font-weight:800;font-size:13px}
.wdays button[aria-pressed="true"]{background:var(--pink);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:#fff;padding:10px 18px;border-radius:16px;font-weight:800;font-size:14px;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.chart svg{width:100%;height:auto;display:block}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.banner{border-radius:var(--r);padding:14px 16px;background:linear-gradient(135deg,#FFE3F0,#EDE4FF);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-weight:700;font-size:14px}
.banner .be{font-size:28px}
.banner .x{font-size:16px;color:var(--muted);padding:4px}
.fact{background:linear-gradient(135deg,#FFF0F7,#F3ECFF);border:2px dashed var(--pink)}
.fact .src{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;background:var(--sunk);color:var(--pink-deep);vertical-align:1px}
.pill.s3{background:var(--pink);color:#fff}.pill.s2{background:var(--m4)}.pill.s1{background:var(--sunk);color:var(--muted)}
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:2px dotted var(--line)}
.insight:first-child{border-top:0}
.insight .ie{font-size:26px;line-height:1.2}
.insight p{margin:2px 0 0;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:18px;padding:12px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-size:26px;line-height:1.1}
.tile span{font-size:12px;font-weight:700;color:var(--muted)}
.wk{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-weight:800}
.year{overflow-x:auto;padding-bottom:4px}
.year svg{display:block}
.candies{display:flex;flex-wrap:wrap;gap:10px}
.candy{width:64px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.candy span{font-size:32px;width:56px;height:56px;border-radius:18px;background:var(--bg);display:grid;place-items:center}
.candy.locked span{filter:grayscale(1);opacity:.35}
.sumchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sumchips .chip{white-space:nowrap}
.restline{display:flex;justify-content:center}
.story{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#FFB6D9 0%,#D9C6FA 55%,#BFE9F5 100%);color:var(--fg);display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.story .bars{display:flex;gap:4px}.story .bars i{flex:1;height:4px;border-radius:2px;background:rgb(255 255 255 / .45)}.story .bars i.on{background:#fff}
.story .top{display:grid;gap:10px}
.story .close{justify-self:end;width:40px;height:40px;border-radius:50%;background:rgb(255 255 255 / .6);font-size:18px}
.story .body{display:grid;align-content:center;justify-items:center;text-align:center;gap:12px;max-width:440px;margin:0 auto;width:100%}
.story .se{font-size:72px;line-height:1}
.story .sn{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1}
.story .st{font-family:var(--f-display);font-size:24px;font-weight:600}
.story .sp{font-size:17px;font-weight:700;max-width:34ch}
.story .ss{font-size:12px;font-weight:700;opacity:.7}
.story .hint{text-align:center;font-size:13px;font-weight:800;opacity:.7}
.story .tapl,.story .tapr{position:absolute;top:80px;bottom:60px;width:40%;background:none}
.story .tapl{left:0}.story .tapr{right:0}
.celebrate{text-align:center;justify-items:center}
.celebrate .ce{font-size:84px;line-height:1}
@media (prefers-reduced-motion:no-preference){.story .body{animation:rise .35s ease}@keyframes rise{from{opacity:.0;transform:translateY(12px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.habit .fill{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Розділи"><div>
  <button data-tab="today" aria-current="page"><span>🌸</span>Сьогодні</button>
  <button data-tab="cal"><span>🗓️</span>Календар</button>
  <button data-tab="stats"><span>📈</span>Статистика</button>
  <button data-tab="set"><span>⚙️</span>Налаштування</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="row"><h2 id="sheetTitle"></h2><button class="ibtn" id="sheetClose" aria-label="Закрити">✕</button></div>
  <div id="sheetBody" style="display:grid;gap:14px"></div>
</div></div>
<div class="toast" id="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<div id="storyRoot"></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
